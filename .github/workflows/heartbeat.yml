name: Heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: '55 10 * * *'

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch heartbeat to Vercel
        run: |
          curl -sf --max-time 30 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.VERCEL_APP_URL }}/api/cron/heartbeat"
