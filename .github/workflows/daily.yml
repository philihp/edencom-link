name: Daily

on:
  workflow_dispatch:
  schedule:
    - cron: '41 11 * * *'

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch daily job to Vercel
        run: |
          curl -sf --max-time 310 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.VERCEL_APP_URL }}/api/cron/daily"
